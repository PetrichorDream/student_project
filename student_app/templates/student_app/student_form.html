<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
</head>
<body>
    <h2>Student Information Form</h2>

    {% if error %}
        <p style="color: red;"><strong>{{ error }}</strong></p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <label>Student Name:</label><br>
        <input type="text" name="student_name" value="{{ student_name }}"><br><br>

        <label>Student ID:</label><br>
        <input type="text" name="student_id" value="{{ student_id }}"><br><br>

        <label>Major:</label><br>
        <select name="major">
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Business Administration">Business Administration</option>
        </select><br><br>

        <label>Class Standing:</label><br>
        <input type="radio" name="class_standing" value="Freshman" checked> Freshman
        <input type="radio" name="class_standing" value="Sophomore"> Sophomore
        <input type="radio" name="class_standing" value="Junior"> Junior
        <input type="radio" name="class_standing" value="Senior"> Senior<br><br>

        <label>Programming Languages Known:</label><br>
        <input type="checkbox" name="languages" value="Python"> Python
        <input type="checkbox" name="languages" value="C++"> C++
        <input type="checkbox" name="languages" value="Java"> Java
        <input type="checkbox" name="languages" value="JavaScript"> JavaScript<br><br>

        <label>Expected Graduation Year:</label><br>
        <input type="number" name="grad_year" min="2024" max="2030" value="2026"><br><br>

        <label>Comments:</label><br>
        <textarea name="comments" rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
